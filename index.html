<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket, Booking и Person Service API</title>
  <link rel="stylesheet" href="./swagger-ui/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="./swagger-ui/swagger-ui-bundle.js"></script>
  <script src="./swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    // se.ifmo.ru passes only GET and POST, so other methods travel as POST
    // with X-HTTP-Method-Override and lab2/api.php restores them.
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        requestInterceptor: function (req) {
          if (req.method !== 'GET' && req.method !== 'POST') {
            req.headers['X-HTTP-Method-Override'] = req.method;
            req.method = 'POST';
          }
          return req;
        },
        urls: [
          { url: './ticket-service.yaml', name: 'Ticket Service' },
          { url: './booking-service.yaml', name: 'Booking Service' },
          { url: './person-service.yaml', name: 'Person Service' }
        ],
        'urls.primaryName': 'Ticket Service',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout'
      });
    };
  </script>
</body>
</html>
