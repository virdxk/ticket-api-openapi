openapi: 3.0.3
info:
  title: Ticket Service API
  version: 1.0.0
  description: |
    Первый веб-сервис, расположенный на URL `/tickets`.

    Поля `id`, `creationDate` и `venue.id` формируются сервером. Все данные
    передаются в JSON. Идентификаторы и параметры выборки передаются в URL.
    Сервис ничего не знает о людях и бронированиях: их хранят Person Service и
    Booking Service.
security: []
servers:
  - url: http://localhost:8080
    description: Локальное окружение
tags:
  - name: Tickets
    description: Базовые CRUD-операции над коллекцией Ticket
  - name: Ticket operations
    description: Специальные операции над коллекцией Ticket

paths:
  /tickets:
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Добавить билет
      description: |
        Создаёт новый элемент коллекции. `id`, `creationDate` и, при наличии
        площадки, `venue.id` генерируются автоматически и не принимаются от клиента.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
            example:
              name: Концертный билет
              coordinates: {x: 12.5, y: 100}
              price: 2500.0
              comment: Первый ряд
              type: USUAL
              venue:
                name: Главный стадион
                capacity: 50000
                type: STADIUM
      responses:
        '201':
          description: Билет создан
          headers:
            Location:
              description: URL созданного билета
              schema: {type: string, format: uri}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: Получить страницу билетов
      description: |
        Возвращает страницу коллекции с фильтрацией и сортировкой по любой
        комбинации полей Ticket, включая вложенные. Фильтры `filter` и
        сортировки `sort` повторяются. Фильтры объединяются через `AND`,
        порядок `sort` задаёт приоритет сортировки.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: Страница билетов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

  /tickets/{ticketId}:
    parameters:
      - {$ref: '#/components/parameters/TicketId'}
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Получить билет по идентификатору
      description: Возвращает один объект Ticket по его уникальному идентификатору.
      responses:
        '200':
          description: Билет найден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Обновить билет
      description: |
        Частично обновляет билет: меняются только переданные поля. `id` и
        `creationDate` не изменяются. Передача `null` очищает nullable-поле
        (`price`, `type`, `venue`).
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/TicketPatch'}
            example:
              price: 3000.0
              type: VIP
      responses:
        '200':
          description: Билет обновлён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Tickets]
      operationId: deleteTicket
      summary: Удалить билет
      description: Удаляет билет с указанным идентификатором.
      responses:
        '204': {description: 'Билет удалён, тело ответа отсутствует'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /tickets/actions/by-type/{type}:
    delete:
      tags: [Ticket operations]
      operationId: deleteAnyTicketByType
      summary: Удалить любой билет заданного типа
      description: Находит и удаляет ровно один произвольный билет с указанным `type`.
      parameters:
        - name: type
          in: path
          required: true
          description: Тип удаляемого билета
          schema: {$ref: '#/components/schemas/TicketType'}
      responses:
        '204': {description: 'Один подходящий билет удалён, тело ответа отсутствует'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

components:
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      description: Уникальный идентификатор билета
      schema: {type: integer, format: int64, minimum: 1}
    Page:
      name: page
      in: query
      description: Номер страницы, начиная с 1
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: size
      in: query
      description: Число элементов на странице
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Sort:
      name: sort
      in: query
      description: |
        Повторяемый параметр `<поле>,<направление>`, например
        `sort=price,desc&sort=name,asc`. Поле: `id`, `name`, `coordinates.x`,
        `coordinates.y`, `creationDate`, `price`, `comment`, `type`, `venue.id`,
        `venue.name`, `venue.capacity` или `venue.type`. Направление: `asc`/`desc`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(id|name|coordinates\.x|coordinates\.y|creationDate|price|comment|type|venue\.id|venue\.name|venue\.capacity|venue\.type),(asc|desc)$'
      example: ['price,desc', 'name,asc']
    Filter:
      name: filter
      in: query
      description: |
        Повторяемый фильтр `<поле><оператор><значение>`. Несколько фильтров
        объединяются через `AND`.

        Операторы: `=`, `!=`, `>`, `>=`, `<`, `<=`, `~` (строка содержит
        подстроку, регистр не учитывается).

        Поля: `id`, `name`, `coordinates.x`, `coordinates.y`, `creationDate`,
        `price`, `comment`, `type`, `venue.id`, `venue.name`, `venue.capacity`,
        `venue.type`. Значение `null` с `=` и `!=` проверяет пустое поле.

        Примеры: `price>=100`, `name~концерт`, `venue.type=STADIUM`,
        `creationDate<2026-10-01T00:00:00`, `price=null`.

        Пример запроса: билеты дороже 100 на стадионах, в названии которых есть
        «концерт», вторая страница по 10 штук, сначала самые дорогие:

        `GET /tickets?filter=price>100&filter=venue.type=STADIUM&filter=name~концерт&sort=price,desc&page=2&size=10`

        В URL спецсимволы кодируются, тот же запрос в закодированном виде:

        `GET /tickets?filter=price%3E100&filter=venue.type%3DSTADIUM&filter=name~%D0%BA%D0%BE%D0%BD%D1%86%D0%B5%D1%80%D1%82&sort=price,desc&page=2&size=10`
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(id|name|coordinates\.x|coordinates\.y|creationDate|price|comment|type|venue\.id|venue\.name|venue\.capacity|venue\.type)(!=|>=|<=|=|>|<|~).*$'
      example: ['price>=100', 'name~концерт']

  schemas:
    TicketType:
      type: string
      enum: [VIP, USUAL, BUDGETARY, CHEAP]
    VenueType:
      type: string
      enum: [PUB, BAR, OPEN_AREA, MALL, STADIUM]
    Coordinates:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x:
          type: number
          format: float
          description: Координата x, обязательна
        y:
          type: number
          format: double
          maximum: 747
          description: Координата y, не более 747
    Venue:
      type: object
      additionalProperties: false
      required: [id, name, capacity, type]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Уникальный идентификатор, генерируется сервером
        name:
          type: string
          minLength: 1
        capacity:
          type: integer
          format: int64
          minimum: 1
        type: {$ref: '#/components/schemas/VenueType'}
    VenueInput:
      type: object
      additionalProperties: false
      required: [name, capacity, type]
      properties:
        name: {type: string, minLength: 1}
        capacity: {type: integer, format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/VenueType'}
    Ticket:
      type: object
      additionalProperties: false
      required: [id, name, coordinates, creationDate, comment]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        name: {type: string, minLength: 1}
        coordinates: {$ref: '#/components/schemas/Coordinates'}
        creationDate:
          type: string
          format: date-time
          readOnly: true
        price:
          type: number
          format: float
          nullable: true
          exclusiveMinimum: true
          minimum: 0
        comment: {type: string, maxLength: 681}
        type:
          type: string
          allOf: [{$ref: '#/components/schemas/TicketType'}]
          nullable: true
        venue:
          type: object
          allOf: [{$ref: '#/components/schemas/Venue'}]
          nullable: true
    TicketCreate:
      type: object
      additionalProperties: false
      required: [name, coordinates, comment]
      properties:
        name: {type: string, minLength: 1}
        coordinates: {$ref: '#/components/schemas/Coordinates'}
        price:
          type: number
          format: float
          nullable: true
          exclusiveMinimum: true
          minimum: 0
        comment: {type: string, maxLength: 681}
        type:
          type: string
          allOf: [{$ref: '#/components/schemas/TicketType'}]
          nullable: true
        venue:
          type: object
          allOf: [{$ref: '#/components/schemas/VenueInput'}]
          nullable: true
    TicketPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Частичное обновление (JSON Merge Patch). Передаются только изменяемые поля,
        `null` очищает nullable-поле. Поле `venue` заменяется целиком.
      properties:
        name: {type: string, minLength: 1}
        coordinates: {$ref: '#/components/schemas/Coordinates'}
        price:
          type: number
          format: float
          nullable: true
          exclusiveMinimum: true
          minimum: 0
        comment: {type: string, maxLength: 681}
        type:
          type: string
          allOf: [{$ref: '#/components/schemas/TicketType'}]
          nullable: true
        venue:
          type: object
          allOf: [{$ref: '#/components/schemas/VenueInput'}]
          nullable: true
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Ticket'}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    Error:
      type: object
      additionalProperties: false
      required: [error_message, error_time]
      properties:
        error_message:
          type: string
          description: Описание ошибки
        error_time:
          type: string
          format: date-time
          description: Время возникновения ошибки
        details:
          type: array
          description: |
            Ошибки валидации JSON запроса, по одной на нарушенное ограничение.
            Необязательное поле: может отсутствовать или быть пустым массивом.
            Заполняется в ответе `422`.
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
                description: Путь к полю в JSON запроса
              message:
                type: string
                description: Какое ограничение нарушено

  responses:
    BadRequest:
      description: Некорректный URL-параметр или синтаксически неверный JSON
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error_message: 'Параметр filter: неизвестное поле "cost"'
            error_time: '2026-10-02T18:30:00Z'
            details: []
    NotFound:
      description: Билет не найден
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error_message: Билет с id=42 не найден
            error_time: '2026-10-02T18:30:00Z'
            details: []
    ValidationError:
      description: JSON корректен синтаксически, но нарушает ограничения целостности
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error_message: JSON запроса нарушает ограничения Ticket
            error_time: '2026-10-02T18:30:00Z'
            details:
              - {field: price, message: должно быть больше 0}
              - {field: coordinates.y, message: должно быть не больше 747}
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error_message: Внутренняя ошибка сервера
            error_time: '2026-10-02T18:30:00Z'
            details: []
