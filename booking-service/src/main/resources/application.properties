spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.web.locale=ru
spring.web.locale-resolver=fixed
spring.messages.basename=messages,common-messages
spring.ssl.bundle.jks.services.truststore.location=classpath:truststore.p12
spring.ssl.bundle.jks.services.truststore.password=soa-lab2-tls
spring.ssl.bundle.jks.services.truststore.type=PKCS12
ticket-service.url=https://localhost:41390
person-service.url=https://localhost:41391
